[project]
name = "procedural-cloud"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]

[project.scripts]
main = "src.main:main"
l = "src.main:hd_main"
h = "src.main:four_k_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["main.py"]
