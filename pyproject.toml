[project]
name = "procedural-cloud"
version = "0.1.0"
description = "Draw image of procedural generated clouds using python script"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
main = "src.main:main"
l = "src.main:hd_main"
h = "src.main:four_k_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["main.py"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
